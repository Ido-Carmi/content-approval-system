{% extends "base.html" %}

{% block title %}פוסטים מתוזמנים{% endblock %}
{% block page_title %}<div class="text-center">📅 פוסטים מתוזמנים</div>{% endblock %}

{% block content %}
<style>
/* Single column design - fit content width */
#scheduled-list {
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.scheduled-card {
    margin-bottom: 0.4rem;
    width: 100%;
    max-width: 900px;
    min-width: 700px;
}

.scheduled-card .card {
    width: 100%;
}

.scheduled-card .btn {
    font-size: 0.85rem;
    padding: 0.3rem 0.6rem;
    font-weight: 600;
}

.scheduled-card textarea {
    font-size: 0.95rem;
    resize: none;
    overflow-y: hidden;
    margin-bottom: 0.3rem !important;
    padding: 0.4rem !important;
    line-height: 1.4 !important;
    width: 100%;
}

.scheduled-card textarea[readonly] {
    background-color: #f8f9fa;
    cursor: not-allowed;
}

.scheduled-card textarea:not([readonly]) {
    background-color: #fff;
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}

/* Reorder buttons styling */
.reorder-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.reorder-buttons .btn {
    padding: 0.2rem 0.4rem;
    font-size: 0.8rem;
}

/* Drag handle */
.drag-handle {
    cursor: grab;
    color: rgba(255,255,255,0.7);
    font-size: 1.1rem;
    padding: 0 4px;
    transition: color 0.15s;
}
.drag-handle:hover { color: #fff; }
.drag-handle:active { cursor: grabbing; }

/* Sortable states */
.sortable-ghost {
    opacity: 0.35;
    background: #cfe2ff !important;
}
.sortable-chosen .card {
    box-shadow: 0 4px 20px rgba(13,110,253,0.4) !important;
    transform: rotate(0.5deg);
}

/* Time display */
.time-display {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.3px;
}

.day-display {
    font-size: 0.85rem;
    margin-right: 0.4rem;
}

/* Card body and header */
.scheduled-card .card-body {
    padding: 0.5rem !important;
}

.scheduled-card .card-header {
    padding: 0.4rem 0.6rem !important;
}

.scheduled-card .gap-2 {
    gap: 0.4rem !important;
}
</style>

<!-- Mobile-responsive styles -->
<style>
@media (max-width: 768px) {
    /* Remove min-width constraint on mobile */
    .scheduled-card {
        min-width: auto !important;
        width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 0.5rem;
    }
    
    /* Header adjustments for mobile */
    .d-flex.justify-content-center > div {
        min-width: auto !important;
        max-width: 100% !important;
        font-size: 0.95rem !important;
        padding: 0.5rem 1rem !important;
    }
    
    /* Card adjustments */
    .scheduled-card .card-header {
        padding: 0.5rem !important;
        font-size: 0.85rem;
    }
    
    .scheduled-card .card-body {
        padding: 0.5rem !important;
    }
    
    /* Button adjustments for mobile */
    .scheduled-card .btn {
        font-size: 0.75rem !important;
        padding: 0.4rem 0.5rem !important;
        white-space: nowrap;
    }
    
    /* Time display adjustments */
    .time-display {
        font-size: 0.8rem !important;
    }
    
    .day-display {
        font-size: 0.75rem !important;
    }
    
    /* Post number badge */
    .badge {
        font-size: 0.8rem !important;
    }
    
    /* Textarea adjustments */
    .scheduled-card textarea {
        font-size: 0.85rem !important;
        padding: 0.5rem !important;
    }
    
    /* Action buttons container */
    .d-flex.gap-2 {
        gap: 0.3rem !important;
        flex-wrap: wrap;
    }
    
    /* Make reorder buttons more compact */
    .reorder-buttons .btn {
        padding: 0.3rem 0.4rem !important;
        font-size: 0.7rem !important;
    }
}

/* Extra small devices (phones, less than 576px) */
@media (max-width: 576px) {
    .scheduled-card .card-header {
        flex-direction: column !important;
        align-items: flex-start !important;
    }
    
    .scheduled-card .card-header > div {
        width: 100%;
        margin-bottom: 0.3rem;
    }
    
    .scheduled-card .btn {
        font-size: 0.7rem !important;
        padding: 0.35rem 0.45rem !important;
    }
    
    .time-display {
        font-size: 0.75rem !important;
    }
    
    .day-display {
        font-size: 0.7rem !important;
    }
    
    /* Stack action buttons vertically on very small screens */
    .flex-grow-1.d-flex {
        flex-direction: column !important;
        width: 100%;
    }
    
    .flex-grow-1.d-flex .btn {
        width: 100% !important;
        margin-bottom: 0.25rem;
    }
}
</style>

<!-- SortableJS for drag-and-drop reordering -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<!-- Content loaded via HTMX -->
<div id="scheduled-content-area"
     hx-get="/scheduled-content"
     hx-trigger="load"
     hx-swap="innerHTML">
    <!-- Loading state -->
    <div class="text-center py-5">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5>טוען פוסטים מתוזמנים...</h5>
        <p class="text-muted">מסנכרן עם פייסבוק</p>
    </div>
</div>

<!-- Loading Overlay - Center of screen -->
<div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center;">
    <div id="loading-indicator" style="background: #0d6efd; color: white; padding: 40px 60px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center; min-width: 400px;">
        <div style="font-size: 3rem; margin-bottom: 20px;">
            <i class="bi bi-arrow-clockwise spin"></i>
        </div>
        <div id="loading-text" style="font-size: 1.5rem; font-weight: 600; margin-bottom: 10px;">מעדכן פוסטים...</div>
        <div id="loading-subtext" style="font-size: 1rem; opacity: 0.9;"></div>
    </div>
</div>

<style>
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.spin {
    display: inline-block;
    animation: spin 1s linear infinite;
}
.pulse {
    animation: pulse 0.6s ease-in-out;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
</style>

<!-- 🔴 DEBUG MARKER: If you can see this text in page source, template renders here -->
<div style="display: none;" id="template-rendered-marker">TEMPLATE RENDERED SUCCESSFULLY</div>

<script>
// Show loading indicator
const loadingOverlay = document.getElementById('loading-overlay');
const loadingIndicator = document.getElementById('loading-indicator');
const loadingText = document.getElementById('loading-text');
const loadingSubtext = document.getElementById('loading-subtext');

// Setup buttons after HTMX loads content
document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'scheduled-content-area') {
        console.log('Content loaded via HTMX, setting up buttons...');
        setupButtons();
    }
});

function setupButtons() {
    
    // Setup edit buttons
    document.querySelectorAll('.edit-btn').forEach(function(btn) {
        console.log('Setting up edit button:', btn.id);
        btn.addEventListener('click', function() {
            const id = this.getAttribute('data-entry-id');
            console.log('Edit button clicked, ID:', id);
            enableEdit(id);
        });
    });
    
    // Setup save buttons
    document.querySelectorAll('.save-btn').forEach(function(btn) {
        console.log('Setting up save button:', btn.id);
        btn.addEventListener('click', function() {
            const id = this.getAttribute('data-entry-id');
            console.log('Save button clicked, ID:', id);
            saveEdit(id);
        });
    });
    
    // Setup unschedule buttons
    document.querySelectorAll('.unschedule-btn').forEach(function(btn) {
        console.log('Setting up unschedule button');
        btn.addEventListener('click', function() {
            const id = this.getAttribute('data-entry-id');
            console.log('Unschedule button clicked, ID:', id);
            unschedulePost(id);
        });
    });
    
    // Setup swap up buttons
    document.querySelectorAll('.swap-up-btn').forEach(function(btn) {
        console.log('Setting up swap-up button');
        btn.addEventListener('click', function() {
            const id = this.getAttribute('data-entry-id');
            console.log('Swap-up button clicked, ID:', id);
            swapPost(id, 'up');
        });
    });
    
    // Setup swap down buttons
    document.querySelectorAll('.swap-down-btn').forEach(function(btn) {
        console.log('Setting up swap-down button');
        btn.addEventListener('click', function() {
            const id = this.getAttribute('data-entry-id');
            console.log('Swap-down button clicked, ID:', id);
            swapPost(id, 'down');
        });
    });
    
    // Setup drag-and-drop reordering
    initSortable();

    console.log('✅ All event listeners set up successfully');
}

function initSortable() {
    const list = document.getElementById('scheduled-list');
    if (!list || !window.Sortable) return;

    Sortable.create(list, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: function(evt) {
            if (evt.oldIndex === evt.newIndex) return;

            // Collect new order of entry IDs
            const cards = list.querySelectorAll('.scheduled-card[data-entry-id]');
            const newOrder = Array.from(cards).map(c => parseInt(c.dataset.entryId));

            showLoading('מסדר מחדש...', 'מעדכן פייסבוק');

            fetch('/reorder_posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order: newOrder })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    const msg = data.failed > 0
                        ? `עודכנו ${data.updated}, ${data.failed} נכשלו`
                        : 'הסדר עודכן';
                    showSuccess('הפוסטים עודכנו!', msg, true);
                } else {
                    alert('שגיאה בסידור מחדש: ' + (data.error || 'unknown'));
                    window.location.reload();
                }
            })
            .catch(err => {
                alert('שגיאה: ' + err.message);
                window.location.reload();
            });
        }
    });
}

// Also try on DOMContentLoaded in case content is already there
document.addEventListener('DOMContentLoaded', function() {
    setupButtons();
});

// Enable editing for a specific post
function enableEdit(id) {
    console.log('=== ENABLE EDIT ===');
    console.log('Entry ID:', id);
    
    const textarea = document.getElementById('text-' + id);
    const editBtn = document.getElementById('edit-' + id);
    const saveBtn = document.getElementById('save-' + id);
    
    console.log('Textarea found:', !!textarea);
    console.log('Edit button found:', !!editBtn);
    console.log('Save button found:', !!saveBtn);
    
    if (saveBtn) {
        console.log('Save button onclick:', saveBtn.onclick);
        console.log('Save button getAttribute onclick:', saveBtn.getAttribute('onclick'));
    }
    
    if (textarea && editBtn && saveBtn) {
        // Make textarea editable
        textarea.removeAttribute('readonly');
        textarea.style.backgroundColor = '#fff';
        textarea.style.borderColor = '#0d6efd';
        textarea.focus();
        
        // Hide edit button, show save button
        editBtn.style.display = 'none';
        saveBtn.style.display = 'block';
        
        console.log('✓ Edit mode enabled');
        console.log('Save button now visible, onclick should work');
        
        // Test save button directly
        console.log('Testing save button click handler...');
        const onclickAttr = saveBtn.getAttribute('onclick');
        console.log('onclick attribute value:', onclickAttr);
    } else {
        console.error('✗ Missing elements!');
        if (!textarea) console.error('  - Textarea missing');
        if (!editBtn) console.error('  - Edit button missing');
        if (!saveBtn) console.error('  - Save button missing');
    }
}

// Save edited post
function saveEdit(id) {
    console.log('=== SAVE EDIT ===');
    console.log('Entry ID:', id);
    console.log('Function called successfully!');
    
    showLoading('מעדכן פוסטים...', 'שומר שינויים');
    
    const textarea = document.getElementById('text-' + id);
    if (!textarea) {
        console.error('✗ Textarea not found for ID:', id);
        alert('שגיאה: לא נמצא טקסט - ID: ' + id);
        return;
    }
    
    console.log('Textarea found:', textarea);
    
    const newText = textarea.value;
    console.log('New text length:', newText.length);
    console.log('New text preview:', newText.substring(0, 50) + '...');
    
    if (!newText || newText.trim() === '') {
        console.error('✗ Empty text!');
        alert('שגיאה: טקסט ריק');
        return;
    }
    
    // Save scroll position
    try {
        const scrollPos = window.pageYOffset;
        sessionStorage.setItem('scrollPos', scrollPos);
        console.log('Saved scroll position:', scrollPos);
    } catch (e) {
        console.log('Could not save scroll position (sessionStorage blocked)');
    }
    
    // Send to server
    console.log('Sending POST to /edit_scheduled/' + id);
    console.log('Request URL:', window.location.origin + '/edit_scheduled/' + id);
    
    fetch('/edit_scheduled/' + id, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ text: newText })
    })
    .then(response => {
        console.log('Response received');
        console.log('Response status:', response.status);
        console.log('Response OK:', response.ok);
        console.log('Response statusText:', response.statusText);
        
        if (response.ok) {
            console.log('✓ Save successful, reloading...');
            showSuccess('הפוסטים עודכנו!', 'השינויים נשמרו', true);
        } else {
            console.error('✗ Save failed with status:', response.status);
            return response.text().then(text => {
                console.error('Response body:', text);
                alert('שגיאה בשמירה (status: ' + response.status + ')\n' + text);
            });
        }
    })
    .catch(error => {
        console.error('✗ Fetch error:', error);
        console.error('Error details:', error.message);
        console.error('Error stack:', error.stack);
        alert('שגיאה בשמירה: ' + error.message);
    });
}

// Swap post order
function swapPost(id, direction) {
    console.log('=== SWAP POST ===');
    console.log('Entry ID:', id);
    console.log('Direction:', direction);
    
    showLoading('מעדכן פוסטים...', 'מחליף סדר');
    
    // Save scroll position
    try {
        const scrollPos = window.pageYOffset;
        sessionStorage.setItem('scrollPos', scrollPos);
        console.log('Saved scroll position:', scrollPos);
    } catch (e) {
        console.log('Could not save scroll position (sessionStorage blocked)');
    }
    
    console.log('Sending POST to /swap_posts/' + id + '/' + direction);
    fetch('/swap_posts/' + id + '/' + direction, {
        method: 'POST'
    })
    .then(response => {
        console.log('Response status:', response.status);
        console.log('Response OK:', response.ok);
        
        if (response.ok) {
            console.log('✓ Swap successful, reloading...');
            showSuccess('הפוסטים עודכנו!', 'הסדר הוחלף', true);
        } else {
            console.error('✗ Swap failed with status:', response.status);
            response.text().then(text => console.error('Response body:', text));
            alert('שגיאה בהחלפה (status: ' + response.status + ')');
        }
    })
    .catch(error => {
        console.error('✗ Fetch error:', error);
        alert('שגיאה בהחלפה: ' + error.message);
    });
}

// Unschedule ALL posts
function unscheduleAll(count) {
    if (!confirm(`האם אתה בטוח שברצונך להחזיר את כל ${count} הפוסטים להמתנה?\nפעולה זו תמחק את כל הפוסטים המתוזמנים מפייסבוק.`)) return;

    showLoading('מחזיר הכל להמתנה...', `מוחק ${count} פוסטים מפייסבוק`);

    fetch('/unschedule_all', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            showSuccess('הכל הוחזר להמתנה!', `${data.count} פוסטים הוחזרו`, true);
        } else {
            alert('שגיאה: ' + (data.error || 'unknown'));
            window.location.reload();
        }
    })
    .catch(err => {
        alert('שגיאה: ' + err.message);
        window.location.reload();
    });
}

// Unschedule post (NO POPUP)
function unschedulePost(id) {
    console.log('=== UNSCHEDULE POST ===');
    console.log('Entry ID:', id);
    
    showLoading('מעדכן פוסטים...', 'מחזיר להמתנה');
    
    // Save scroll position
    try {
        const scrollPos = window.pageYOffset;
        sessionStorage.setItem('scrollPos', scrollPos);
        console.log('Saved scroll position:', scrollPos);
    } catch (e) {
        console.log('Could not save scroll position (sessionStorage blocked)');
    }
    
    console.log('Sending POST to /unschedule/' + id);
    fetch('/unschedule/' + id, {
        method: 'POST'
    })
    .then(response => {
        console.log('Response status:', response.status);
        console.log('Response OK:', response.ok);
        
        if (response.ok) {
            console.log('✓ Unschedule successful, reloading...');
            showSuccess('הפוסטים עודכנו!', 'הפוסט הוחזר להמתנה', true);
        } else {
            console.error('✗ Unschedule failed with status:', response.status);
            response.text().then(text => console.error('Response body:', text));
            alert('שגיאה בהחזרה (status: ' + response.status + ')');
        }
    })
    .catch(error => {
        console.error('✗ Fetch error:', error);
        alert('שגיאה בהחזרה: ' + error.message);
    });
}

// Restore scroll position on page load
window.addEventListener('load', function() {
    console.log('=== PAGE LOAD ===');
    
    try {
        const scrollPos = sessionStorage.getItem('scrollPos');
        console.log('Stored scroll position:', scrollPos);
        
        if (scrollPos) {
            console.log('Restoring scroll to:', scrollPos);
            window.scrollTo(0, parseInt(scrollPos));
            sessionStorage.removeItem('scrollPos');
            console.log('✓ Scroll restored');
        } else {
            console.log('No scroll position to restore');
        }
    } catch (e) {
        console.log('Could not access scroll position (sessionStorage blocked)');
    }
});

// Helper functions for loading indicator
function showLoading(message, subtext = '') {
    loadingOverlay.style.display = 'flex';
    loadingIndicator.style.background = '#0d6efd';
    loadingText.textContent = message;
    loadingSubtext.textContent = subtext;
    const icon = document.querySelector('#loading-indicator i');
    icon.className = 'bi bi-arrow-clockwise spin';
}

function showSuccess(message, subtext = '', autoRefresh = true) {
    loadingText.textContent = message;
    loadingSubtext.textContent = subtext;
    loadingIndicator.style.background = '#198754';
    loadingIndicator.classList.add('pulse');
    const icon = document.querySelector('#loading-indicator i');
    icon.className = 'bi bi-check-circle-fill';
    
    if (autoRefresh) {
        setTimeout(() => {
            window.location.reload();
        }, 1500);
    }
}

function hideLoading() {
    setTimeout(function() {
        loadingOverlay.style.opacity = '0';
        setTimeout(function() {
            loadingOverlay.style.display = 'none';
            loadingOverlay.style.opacity = '1';
            loadingIndicator.classList.remove('pulse');
        }, 300);
    }, 1500);
}
</script>
{% endblock %}
